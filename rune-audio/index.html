<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bindrune · with sound guide</title>
<style>
  html, body { margin: 0; height: 100%; background: #140d07; overflow: hidden; }
  /* The real game (Rune Vision, unchanged) fills the whole window. */
  #game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  /* The sound guide buttons: always on top, bottom left. */
  #bar { position: fixed; left: 14px; bottom: 14px; z-index: 50; display: flex; gap: 8px; align-items: center; }
  #bar button {
    font: 16px Georgia, serif; color: #f3e4c4; background: #2b1d12;
    border: 2px solid #d9a441; border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  #guideBtn[aria-pressed="true"] { background: #7a4f20; }
  #skipBtn { display: none; }
  #skipBtn.show { display: block; }

  /* Big caption of what the guide just said (for low-vision and hard-of-hearing visitors). */
  #caption {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 49;
    width: min(900px, 70vw); padding: 12px 18px; box-sizing: border-box;
    font: 22px/1.4 Georgia, serif; color: #fff7e6; text-align: center;
    background: rgba(20, 13, 7, .92); border: 1px solid #d9a441; border-radius: 8px;
    display: none;
  }
  #caption.show { display: block; }
  #caption:empty { display: none; }

  /* Guide view (key T): what the guide sees. Bright = rune colour, ring = the rune it follows, purple = learned background. */
  #guideView {
    position: fixed; right: 14px; bottom: 14px; z-index: 51; width: min(480px, 38vw); height: auto;
    border: 2px solid #d9a441; border-radius: 6px; background: #000; image-rendering: pixelated; display: none;
  }
  #guideView.show { display: block; }
</style>
</head>
<body>
  <!-- The game itself. Nothing in rune-vision/ is changed: this page only listens to it. -->
  <iframe id="game" src="../rune-vision/index.html" allow="camera; autoplay" title="Bindrune"></iframe>

  <div id="bar">
    <button id="guideBtn" aria-pressed="false" title="Spoken guide for blind and low-vision visitors. Keys: H = where am I, N = skip, + / - = speed, T = guide view">Sound guide: off (V)</button>
    <button id="skipBtn" title="Skip what is being said now">Skip (N)</button>
  </div>
  <!-- No aria-live here on purpose: the guide already speaks every line, a screen reader would say it twice. -->
  <div id="caption"></div>
  <canvas id="guideView" width="240" height="135"></canvas>

  <script type="module" src="audio.js"></script>
</body>
</html>
